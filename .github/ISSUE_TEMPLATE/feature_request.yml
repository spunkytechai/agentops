name: Feature request
description: Propose a capability or improvement.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Focus on the problem and expected outcome. AgentOps prioritizes provider-neutral interfaces, explicit security boundaries, and cross-SDK consistency.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What limitation or user need does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the API or workflow you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Python SDK
        - TypeScript SDK
        - Cross-SDK conformance
        - Security / policy
        - Evaluation / observability
        - Documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: safeguards
    attributes:
      label: Design considerations
      options:
        - label: I have considered privacy and sensitive-data handling.
        - label: I have considered failure modes and backwards compatibility.
        - label: I can help implement or validate this proposal.
          required: false
