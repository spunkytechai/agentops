name: Feature request
description: Propose a focused improvement to AgentOps
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What are you trying to accomplish, and what is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful behavior from a user's perspective.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      multiple: true
      options: [Python SDK, TypeScript SDK, Cross-language conformance, Worker execution, Security and governance, Documentation, Developer experience]
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and security considerations
    validations:
      required: false
