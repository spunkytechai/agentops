name: Bug report
description: Report a reproducible defect in AgentOps
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: "Do not include API keys, credentials, private prompts, customer data, or sensitive traces. Report vulnerabilities privately using SECURITY.md."
  - type: input
    id: version
    attributes:
      label: AgentOps version or commit
    validations:
      required: true
  - type: dropdown
    id: sdk
    attributes:
      label: SDK
      options: [Python, TypeScript, Both, "Docker worker"]
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime and operating system
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs (remove secrets and personal data)
      render: text
