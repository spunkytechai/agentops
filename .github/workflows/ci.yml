name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Verify installed Python dependencies
        run: python -m pip check
      - name: Run tests
        run: python -m unittest discover -s packages/python/tests -v
      - name: Build and verify Python wheel license files
        run: |
          python -m pip install build==1.6.1
          python -m build --wheel --outdir dist
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected one wheel, found {len(wheels)}")
          with ZipFile(wheels[0]) as wheel:
              names = set(wheel.namelist())
          for required in ("LICENSE", "NOTICE"):
              if not any(name.rsplit("/", 1)[-1] == required for name in names):
                  raise SystemExit(f"{required} missing from Python wheel")
          print("Python wheel contains LICENSE and NOTICE")
          PY

  typescript:
    name: TypeScript / Node 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: packages/typescript
        run: npm install
      - name: Report resolved top-level dependencies
        working-directory: packages/typescript
        run: npm ls --depth=0
      - name: Build and test
        working-directory: packages/typescript
        run: npm test
      - name: Verify published package includes license notices
        working-directory: packages/typescript
        run: |
          cmp ../../LICENSE LICENSE
          cmp ../../NOTICE NOTICE
          npm pack --dry-run --json > npm-pack.json
          node -e "const p = require('./npm-pack.json')[0]; const files = new Set(p.files.map(f => f.path)); for (const name of ['LICENSE', 'NOTICE']) { if (!files.has(name)) throw new Error(name + ' missing from npm package'); }"

  docker-integration:
    name: Docker worker integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Install Python package
        run: python -m pip install -e .
      - name: Install TypeScript dependencies
        working-directory: packages/typescript
        run: npm install
      - name: Build example worker image
        run: docker build -f examples/Dockerfile.worker -t agentops-example-worker:ci .
      - name: Run Python tests against real container
        env:
          AGENTOPS_DOCKER_INTEGRATION: "1"
        run: python -m unittest discover -s packages/python/tests -v
      - name: Run TypeScript tests against real container
        working-directory: packages/typescript
        env:
          AGENTOPS_DOCKER_INTEGRATION: "1"
        run: npm test
